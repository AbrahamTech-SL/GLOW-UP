<h2 class="font-headline-md text-headline-md text-on-surface font-bold tracking-tight">

<p class="font-body-md text-body-md text-on-surface-variant">

          </p>
</div>
<!-- Dismiss / Close Button -->
<button aria-label="Close" class="w-10 h-10 -mr-1 flex items-center justify-center rounded-full bg-surface-container-low text-on-surface hover:bg-surface-container active:scale-90 transition-all shadow-sm" onclick="history.back()">

<!-- Action Grid: 2-Column Responsive Layout -->

</button>
<!-- 3. Goal -->

</button>

</div>
<span class="font-headline-sm text-headline-sm text-on-surface font-bold leading-snug">Income</span>
<span class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">Add income or savings</span>
<div class="absolute bottom-0 left-0 right-0 h-1 bg-transparent group-hover:bg-primary-fixed-dim transition-colors"></div>
</button>
<!-- 6. Trade -->
<button class="group flex flex-col text-left p-4 rounded-lg bg-surface-container-lowest hover:bg-surface-container-low active:scale-[0.97] transition-all duration-150 shadow-sm relative overflow-hidden" onclick="triggerSelection(this, 'Trade')" type="button">
<div class="w-11 h-11 rounded-full bg-tertiary-fixed text-on-tertiary-fixed flex items-center justify-center mb-3 group-hover:scale-105 transition-transform">

</div>
<span class="font-headline-sm text-headline-sm text-on-surface font-bold leading-snug">Trade</span>

</button>

<p class="font-body-sm text-body-sm text-on-surface-variant leading-snug">

        </p>
</div>
</div>
<!-- Interactive Navigation Dock with Active Floating Center CTA -->
<div class="w-full mt-4 pt-2 flex items-center justify-between px-6 bg-surface-container-lowest/90 backdrop-blur-md rounded-full shadow-lg py-2.5">

<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors py-1" onclick="history.back()">

</button>

</button>

<div class="relative -top-5 flex items-center justify-center">

</button>

</button>
</div>
<!-- Particle feedback placeholder anchor -->
<div class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-inverse-surface text-inverse-on-surface px-4 py-2 rounded-full font-label-md text-label-md opacity-0 pointer-events-none transition-opacity duration-300 shadow-md flex items-center gap-2" id="toast-notify">
<span class="material-symbols-outlined text-secondary-fixed text-[18px]">check</span>
<span id="toast-text">Opening...</span>
</div>
</div>
</div>
<script>
  function triggerSelection(card, actionName) {
    // Subtle visual bump feedback
    card.classList.add('bg-primary-container/20');
    setTimeout(() => card.classList.remove('bg-primary-container/20'), 300);

    // Show instant toast reaction
    const toast = document.getElementById('toast-notify');
    const toastText = document.getElementById('toast-text');
    if (toast && toastText) {
      toastText.textContent = `Opening new ${actionName}...`;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 1500);
    }
  }
</script></main></body></html>
