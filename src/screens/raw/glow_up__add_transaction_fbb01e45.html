<script>
  function switchType(type) {
    const expenseBtn = document.getElementById('tab-expense');
    const incomeBtn = document.getElementById('tab-income');
    const caption = document.getElementById('type-caption');

    if (type === 'expense') {
      expenseBtn.className = 'flex-1 py-3 px-4 rounded-full bg-primary-container text-on-primary-fixed font-label-lg text-label-lg transition-all shadow-sm flex items-center justify-center gap-1.5';
      incomeBtn.className = 'flex-1 py-3 px-4 rounded-full text-on-surface-variant hover:text-on-surface font-label-lg text-label-lg transition-all flex items-center justify-center gap-1.5';
      caption.textContent = 'Logged as Personal Expense';
    } else {
      incomeBtn.className = 'flex-1 py-3 px-4 rounded-full bg-primary-container text-on-primary-fixed font-label-lg text-label-lg transition-all shadow-sm flex items-center justify-center gap-1.5';
      expenseBtn.className = 'flex-1 py-3 px-4 rounded-full text-on-surface-variant hover:text-on-surface font-label-lg text-label-lg transition-all flex items-center justify-center gap-1.5';
      caption.textContent = 'Logged as Confirmed Income';
    }
  }

  function selectCat(element) {
    const pills = document.querySelectorAll('.cat-pill');
    pills.forEach(pill => {
      pill.className = 'cat-pill h-[36px] px-3.5 rounded-full bg-surface-container-lowest text-on-surface font-label-md text-label-md flex items-center gap-1.5 hover:bg-surface-container transition-all shadow-sm';
      const check = pill.querySelector('.material-symbols-outlined');
      if (check) check.remove();
    });

    element.className = 'cat-pill h-[36px] px-3.5 rounded-full bg-primary-container text-on-primary-fixed font-label-md text-label-md flex items-center gap-1.5 transition-all shadow-sm';
    const checkIcon = document.createElement('span');
    checkIcon.className = 'material-symbols-outlined text-[16px] -mr-1';
    checkIcon.textContent = 'check';
    element.appendChild(checkIcon);
  }

  function saveTransaction() {
    const btn = event.currentTarget;
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span><span>Saving...</span>';
    setTimeout(() => {
      btn.innerHTML = '<span class="material-symbols-outlined text-[20px]">check_circle</span><span>Recorded!</span>';
      setTimeout(() => {
        window.history.back();
      }, 500);
    }, 600);
  }
